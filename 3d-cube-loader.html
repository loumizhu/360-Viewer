<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cube Loader Animation</title>
    <style>
        /* Loader Container */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: #17141d;
            z-index: 9999999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow: column;
        }

        /* 3D Boxes Animation */
        .boxes {
            --size: 32px;
            --duration: 800ms;
            height: calc(var(--size) * 2);
            width: calc(var(--size) * 3);
            position: relative;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            margin-top: calc(var(--size) * 1.5 * -1);
            transform: rotateX(60deg) rotate(45deg) rotateY(0deg) translateZ(0);
        }

        .boxes .box {
            width: var(--size);
            height: var(--size);
            top: 0;
            left: 0;
            position: absolute;
            transform-style: preserve-3d;
        }

        .boxes .box:nth-child(1) {
            transform: translate(100%);
            animation: box1 var(--duration) linear infinite;
        }

        .boxes .box:nth-child(2) {
            transform: translateY(100%);
            animation: box2 var(--duration) linear infinite;
        }

        .boxes .box:nth-child(3) {
            transform: translate(100%, 100%);
            animation: box3 var(--duration) linear infinite;
        }

        .boxes .box:nth-child(4) {
            transform: translate(200%);
            animation: box4 var(--duration) linear infinite;
        }

        .boxes .box>div {
            --background: #0bb3b3;
            --top: auto;
            --right: auto;
            --bottom: auto;
            --left: auto;
            --translateZ: calc(var(--size) / 2);
            --rotateY: 0deg;
            --rotateX: 0deg;
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--background);
            top: var(--top);
            right: var(--right);
            bottom: var(--bottom);
            left: var(--left);
            transform: rotateY(var(--rotateY)) rotateX(var(--rotateX)) translateZ(var(--translateZ));
        }

        /* Front face */
        .boxes .box>div:nth-child(1) {
            --top: 0;
            --left: 0;
        }

        /* Right face */
        .boxes .box>div:nth-child(2) {
            --background: rgb(7, 125, 125);
            --right: 0;
            --rotateY: 90deg;
        }

        /* Top face */
        .boxes .box>div:nth-child(3) {
            --background: rgb(59, 194, 194);
            --rotateX: -90deg;
        }

        /* Back face */
        .boxes .box>div:nth-child(4) {
            --background: #313139;
            --top: 0;
            --left: 0;
            --translateZ: calc(var(--size) * 3 * -1);
        }

        /* Animations for each box */
        @keyframes box1 {

            0%,
            50% {
                transform: translate(100%);
            }

            100% {
                transform: translate(200%);
            }
        }

        @keyframes box2 {
            0% {
                transform: translateY(100%);
            }

            50% {
                transform: translate(0);
            }

            100% {
                transform: translate(100%);
            }
        }

        @keyframes box3 {

            0%,
            50% {
                transform: translate(100%, 100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        @keyframes box4 {
            0% {
                transform: translate(200%);
            }

            50% {
                transform: translate(200%, 100%);
            }

            100% {
                transform: translate(100%, 100%);
            }
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="boxes">
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>

    <script>
        // Optional: Auto-hide loader after page loads
        // Uncomment the following code if you want the loader to disappear after a delay

        */
    </script>
</body>

</html>
